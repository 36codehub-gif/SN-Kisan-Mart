<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Products | SN Kisan Mart</title>

<link rel="stylesheet" href="css/style.css">

<style>
    .products-page {
        padding: 60px 5%;
        background: #f7faf7;
        min-height: 70vh;
    }

    .products-header {
        text-align: center;
        margin-bottom: 35px;
    }

    .products-header h1 {
        font-size: 38px;
        margin-bottom: 10px;
        color: #173d25;
    }

    .products-header p {
        color: #666;
    }

    .product-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 30px;
        flex-wrap: wrap;
    }

    .category-filter {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    .category-filter button {
        border: 1px solid #d7e4d9;
        background: white;
        padding: 10px 18px;
        border-radius: 25px;
        cursor: pointer;
        font-weight: 600;
        transition: 0.3s;
    }

    .category-filter button:hover,
    .category-filter button.active {
        background: #198754;
        color: white;
        border-color: #198754;
    }

    .sort-select {
        padding: 11px 15px;
        border: 1px solid #d7e4d9;
        border-radius: 8px;
        background: white;
        outline: none;
    }

    .products-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 25px;
    }

    .product-card {
        background: white;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        transition: 0.3s;
    }

    .product-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 25px rgba(0,0,0,0.10);
    }

    .product-image {
        height: 190px;
        background: #eef7ef;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 65px;
    }

    .product-info {
        padding: 20px;
    }

    .product-category {
        font-size: 13px;
        color: #198754;
        font-weight: 600;
        margin-bottom: 7px;
    }

    .product-info h3 {
        margin-bottom: 10px;
        color: #222;
    }

    .product-description {
        color: #777;
        font-size: 14px;
        line-height: 1.5;
        margin-bottom: 15px;
    }

    .product-bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
    }

    .product-price {
        font-size: 20px;
        font-weight: 700;
        color: #173d25;
    }

    .add-cart-btn {
        border: none;
        background: #198754;
        color: white;
        padding: 10px 14px;
        border-radius: 7px;
        cursor: pointer;
        font-weight: 600;
    }

    .add-cart-btn:hover {
        background: #146c43;
    }

    @media (max-width: 1000px) {
        .products-grid {
            grid-template-columns: repeat(3, 1fr);
        }
    }

    @media (max-width: 700px) {
        .products-page {
            padding: 40px 4%;
        }

        .products-header h1 {
            font-size: 30px;
        }

        .products-grid {
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .product-image {
            height: 150px;
            font-size: 50px;
        }

        .product-info {
            padding: 15px;
        }

        .product-bottom {
            flex-direction: column;
            align-items: stretch;
        }

        .add-cart-btn {
            width: 100%;
        }
    }

    @media (max-width: 450px) {
        .products-grid {
            grid-template-columns: 1fr;
        }
    }
</style>

</head><body><!-- HEADER -->
<header class="header">
    <div class="container header-inner">

        <a href="index.html" class="logo">
            <span>🌱</span>
            SN Kisan Mart
        </a>

        <div class="search-box">
            <input
                type="text"
                id="productSearch"
                placeholder="Search products..."
            >

            <button onclick="searchProducts()">
                🔍
            </button>
        </div>

        <nav class="nav">
            <a href="index.html">Home</a>

            <a href="products.html" class="active">
                Products
            </a>

            <a href="index.html#categories">
                Categories
            </a>

            <a href="index.html#about">
                About
            </a>
        </nav>

        <div class="header-actions">

            <button onclick="openCart()">
                🛒
                <span id="cartCount">0</span>
            </button>

            <button onclick="openLoginModal()">
                👤
            </button>

        </div>

    </div>
</header>


<!-- PRODUCTS -->
<main class="products-page">

    <div class="products-header">

        <h1>
            Our Products
        </h1>

        <p>
            Quality farming products for better crops and better farming.
        </p>

    </div>


    <!-- FILTER + SORT -->
    <div class="product-controls">

        <div class="category-filter">

            <button
                class="active"
                onclick="filterProducts('all', this)"
            >
                All
            </button>

            <button
                onclick="filterProducts('Seeds', this)"
            >
                Seeds
            </button>

            <button
                onclick="filterProducts('Fertilizers', this)"
            >
                Fertilizers
            </button>

            <button
                onclick="filterProducts('Crop Protection', this)"
            >
                Crop Protection
            </button>

            <button
                onclick="filterProducts('Farm Tools', this)"
            >
                Farm Tools
            </button>

        </div>


        <select
            class="sort-select"
            id="sortProducts"
            onchange="sortProducts()"
        >

            <option value="default">
                Sort By
            </option>

            <option value="low">
                Price: Low to High
            </option>

            <option value="high">
                Price: High to Low
            </option>

            <option value="name">
                Name: A-Z
            </option>

        </select>

    </div>


    <!-- PRODUCTS WILL LOAD HERE -->
    <div
        class="products-grid"
        id="productsGrid"
    ></div>

</main>


<!-- CART OVERLAY -->
<div
    id="cartOverlay"
    class="cart-overlay"
></div>


<!-- CART SIDEBAR -->
<aside
    id="cartSidebar"
    class="cart-sidebar"
>

    <div class="cart-header">

        <h2>
            Your Cart
        </h2>

        <button onclick="closeCart()">
            ✕
        </button>

    </div>


    <div id="cartItems"></div>


    <div class="cart-footer">

        <div class="cart-total">

            <strong>
                Total:
            </strong>

            <strong id="cartTotal">
                ₹0
            </strong>

        </div>


        <button
            onclick="checkout()"
            class="btn btn-primary"
        >
            Checkout
        </button>

    </div>

</aside>


<!-- LOGIN MODAL -->
<div
    id="loginModal"
    class="modal"
>

    <div class="modal-content">

        <button
            class="modal-close"
            onclick="closeLoginModal()"
        >
            ✕
        </button>

        <h2>
            Login
        </h2>


        <form id="loginForm">

            <input
                type="email"
                id="loginEmail"
                placeholder="Email address"
                required
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                required
            >

            <button
                type="submit"
                class="btn btn-primary"
            >
                Login
            </button>

        </form>

    </div>

</div>


<!-- TOAST -->
<div
    id="toast"
    class="toast"
></div>


<!-- JAVASCRIPT -->
<script src="js/script.js"></script>

<script src="js/products.js"></script>

</body>
</html>
