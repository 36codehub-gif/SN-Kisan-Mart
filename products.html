<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products | SN Kisan Mart</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        /* =========================================
           PRODUCTS PAGE
        ========================================= */

        .products-page {
            padding: 55px 5% 70px;
            background: #f6faf7;
            min-height: 75vh;
        }


        /* =========================================
           PAGE HEADER
        ========================================= */

        .products-header {
            text-align: center;
            margin-bottom: 38px;
        }

        .products-header .small-title {
            display: inline-block;

            padding: 7px 14px;
            margin-bottom: 12px;

            background: #e5f5e9;
            color: #198754;

            border-radius: 30px;

            font-size: 12px;
            font-weight: 800;
            letter-spacing: .5px;
            text-transform: uppercase;
        }

        .products-header h1 {
            margin: 0 0 10px;

            color: #173d25;

            font-size: 40px;
            font-weight: 800;
        }

        .products-header p {
            max-width: 650px;
            margin: auto;

            color: #6c757d;

            font-size: 15px;
            line-height: 1.6;
        }


        /* =========================================
           SEARCH + FILTER AREA
        ========================================= */

        .product-toolbar {
            max-width: 1200px;
            margin: 0 auto 30px;

            background: #ffffff;

            padding: 18px;

            border: 1px solid #e5eee7;
            border-radius: 18px;

            box-shadow: 0 8px 25px rgba(20, 70, 35, .06);
        }


        .product-search-row {
            display: flex;
            gap: 12px;

            margin-bottom: 18px;
        }


        .product-search {
            flex: 1;

            position: relative;
        }


        .product-search input {
            width: 100%;

            box-sizing: border-box;

            padding: 14px 50px 14px 17px;

            border: 1px solid #dbe7de;
            border-radius: 12px;

            outline: none;

            font-size: 14px;

            background: #fbfdfb;

            transition: .25s;
        }


        .product-search input:focus {
            border-color: #198754;

            background: #ffffff;

            box-shadow:
                0 0 0 4px rgba(25, 135, 84, .08);
        }


        .product-search button {
            position: absolute;

            right: 5px;
            top: 5px;

            width: 40px;
            height: 40px;

            border: none;
            border-radius: 9px;

            background: #198754;
            color: #ffffff;

            cursor: pointer;

            font-size: 16px;

            transition: .2s;
        }


        .product-search button:hover {
            background: #157347;
        }


        /* =========================================
           FILTER ROW
        ========================================= */

        .product-controls {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 15px;

            flex-wrap: wrap;
        }


        .category-filter {
            display: flex;

            gap: 8px;

            flex-wrap: wrap;
        }


        .category-filter button {
            border: 1px solid #dce8df;

            background: #ffffff;

            color: #385441;

            padding: 9px 15px;

            border-radius: 30px;

            cursor: pointer;

            font-size: 13px;
            font-weight: 700;

            transition: .25s;
        }


        .category-filter button:hover {
            border-color: #198754;
            color: #198754;
        }


        .category-filter button.active {
            background: #198754;
            color: #ffffff;
            border-color: #198754;

            box-shadow:
                0 4px 12px rgba(25, 135, 84, .18);
        }


        /* =========================================
           SORT
        ========================================= */

        .sort-select {
            min-width: 180px;

            padding: 10px 13px;

            background: #ffffff;

            border: 1px solid #dce8df;
            border-radius: 10px;

            color: #263c2d;

            outline: none;

            font-size: 13px;
            font-weight: 600;

            cursor: pointer;
        }


        .sort-select:focus {
            border-color: #198754;
        }


        /* =========================================
           PRODUCTS GRID
        ========================================= */

        .products-grid {
            max-width: 1200px;
            margin: auto;

            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 22px;
        }


        /* =========================================
           PRODUCT CARD
        ========================================= */

        .product-card {
            position: relative;

            background: #ffffff;

            border: 1px solid #e8eee9;

            border-radius: 18px;

            overflow: hidden;

            box-shadow:
                0 6px 20px rgba(20, 70, 35, .06);

            cursor: pointer;

            transition:
                transform .25s ease,
                box-shadow .25s ease,
                border-color .25s ease;
        }


        .product-card:hover {
            transform: translateY(-6px);

            border-color: #d1e5d6;

            box-shadow:
                0 14px 30px rgba(20, 70, 35, .12);
        }


        /* =========================================
           PRODUCT IMAGE
        ========================================= */

        .product-image {
            height: 185px;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;

            background:
                linear-gradient(
                    135deg,
                    #edf8ef,
                    #f8fcf8
                );

            font-size: 70px;
        }


        .product-image::after {
            content: "";

            position: absolute;

            width: 100px;
            height: 100px;

            border-radius: 50%;

            background: rgba(255,255,255,.45);
        }


        .product-image {
            isolation: isolate;
        }


        .product-image::before {
            content: "";

            position: absolute;

            width: 60px;
            height: 60px;

            border-radius: 50%;

            background: rgba(25,135,84,.08);

            transform: translate(28px, 25px);
        }


        .product-image {
            z-index: 1;
        }


        .product-image::after,
        .product-image::before {
            z-index: -1;
        }


        /* =========================================
           PRODUCT INFO
        ========================================= */

        .product-info {
            padding: 18px;
        }


        .product-category {
            display: inline-block;

            margin-bottom: 8px;

            padding: 5px 9px;

            background: #eaf6ed;

            color: #198754;

            border-radius: 6px;

            font-size: 10px;

            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: .4px;
        }


        .product-info h3 {
            margin: 0 0 8px;

            color: #1d2f23;

            font-size: 17px;
            line-height: 1.35;

            min-height: 46px;
        }


        .product-description {
            color: #737b75;

            font-size: 13px;
            line-height: 1.5;

            margin: 0 0 16px;

            min-height: 40px;
        }


        /* =========================================
           PRICE + CART
        ========================================= */

        .product-bottom {
            display: flex;

            flex-direction: column;

            gap: 11px;
        }


        .product-price {
            color: #173d25;

            font-size: 22px;
            font-weight: 800;
        }


        /* IMPORTANT:
           Only Products page Add to Cart
        */

        .product-card .add-cart-btn {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 8px;

            padding: 12px 15px;

            border: none;
            border-radius: 10px;

            background: #198754;
            color: #ffffff;

            font-size: 14px;
            font-weight: 800;

            cursor: pointer;

            transition: .25s;

            box-shadow:
                0 5px 12px rgba(25, 135, 84, .16);
        }


        .product-card .add-cart-btn::before {
            content: "🛒";
        }


        .product-card .add-cart-btn:hover {
            background: #157347;

            transform: translateY(-2px);

            box-shadow:
                0 8px 18px rgba(25, 135, 84, .25);
        }


        .product-card .add-cart-btn:active {
            transform: scale(.97);
        }


        /* =========================================
           MODERN HEADER ACCOUNT + CART
        ========================================= */

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }


        .products-account-btn {
            display: flex;
            align-items: center;
            gap: 9px;

            padding: 7px 12px 7px 7px;

            border: 1px solid #dce8df;
            border-radius: 13px;

            background: #ffffff;

            color: #173d25;

            text-decoration: none;

            cursor: pointer;

            transition: .25s;
        }


        .products-account-avatar {
            width: 36px;
            height: 36px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background: #e8f5eb;

            font-size: 18px;
        }


        .products-account-text {
            display: flex;
            flex-direction: column;

            align-items: flex-start;

            line-height: 1.2;
        }


        .products-account-text strong {
            font-size: 13px;
        }


        .products-account-text small {
            margin-top: 3px;

            color: #7b857d;

            font-size: 10px;
        }


        .products-account-btn:hover {
            border-color: #198754;

            transform: translateY(-2px);

            box-shadow:
                0 7px 18px rgba(25,135,84,.10);
        }


        /* CART */

        .products-cart-btn {
            position: relative;

            display: flex;
            align-items: center;
            gap: 9px;

            padding: 7px 13px 7px 7px;

            border: none;
            border-radius: 13px;

            background: #198754;
            color: #ffffff;

            cursor: pointer;

            transition: .25s;
        }


        .products-cart-icon {
            width: 36px;
            height: 36px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background: rgba(255,255,255,.16);

            font-size: 18px;
        }


        .products-cart-text {
            display: flex;
            flex-direction: column;

            align-items: flex-start;

            line-height: 1.2;
        }


        .products-cart-text strong {
            font-size: 13px;
        }


        .products-cart-text small {
            margin-top: 3px;

            font-size: 10px;

            opacity: .8;
        }


        .products-cart-btn:hover {
            background: #157347;

            transform: translateY(-2px);

            box-shadow:
                0 8px 18px rgba(25,135,84,.22);
        }


        .products-cart-count {
            position: absolute;

            top: -7px;
            right: -7px;

            min-width: 21px;
            height: 21px;

            padding: 0 5px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #ff4d4f;
            color: #ffffff;

            border: 2px solid #ffffff;

            border-radius: 50%;

            font-size: 10px;
            font-weight: 800;
        }


        /* =========================================
           TABLET
        ========================================= */

        @media (max-width: 1100px) {

            .products-grid {
                grid-template-columns:
                    repeat(3, minmax(0, 1fr));
            }

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 750px) {

            .products-page {
                padding: 38px 4% 55px;
            }


            .products-header {
                margin-bottom: 25px;
            }


            .products-header h1 {
                font-size: 30px;
            }


            .products-header p {
                font-size: 13px;
            }


            .product-toolbar {
                padding: 13px;

                border-radius: 15px;
            }


            .product-search-row {
                margin-bottom: 13px;
            }


            .product-controls {
                align-items: stretch;
            }


            .category-filter {
                width: 100%;
            }


            .category-filter button {
                padding: 8px 12px;

                font-size: 11px;
            }


            .sort-select {
                width: 100%;
            }


            .products-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));

                gap: 13px;
            }


            .product-image {
                height: 135px;

                font-size: 50px;
            }


            .product-info {
                padding: 13px;
            }


            .product-info h3 {
                font-size: 14px;

                min-height: 38px;
            }


            .product-description {
                font-size: 11px;

                min-height: 48px;
            }


            .product-price {
                font-size: 18px;
            }


            .product-card .add-cart-btn {
                padding: 10px 8px;

                font-size: 12px;
            }


            .products-account-text,
            .products-cart-text {
                display: none;
            }


            .products-account-btn,
            .products-cart-btn {
                padding: 6px;

                border-radius: 11px;
            }


            .products-account-avatar,
            .products-cart-icon {
                width: 36px;
                height: 36px;
            }

        }


        /* =========================================
           SMALL MOBILE
        ========================================= */

        @media (max-width: 450px) {

            .products-grid {
                grid-template-columns: 1fr;
            }


            .product-image {
                height: 165px;

                font-size: 60px;
            }


            .product-info h3 {
                font-size: 16px;

                min-height: auto;
            }


            .product-description {
                font-size: 13px;

                min-height: auto;
            }


            .product-bottom {
                flex-direction: row;

                align-items: center;
            }


            .product-card .add-cart-btn {
                width: auto;

                min-width: 125px;
            }

        }

    </style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header class="header">

    <div class="container header-inner">


        <!-- LOGO -->

        <a href="index.html" class="logo">

            <span>🌱</span>

            SN Kisan Mart

        </a>


        <!-- SEARCH -->

        <div class="search-box">

            <input
                type="search"
                id="productSearch"
                placeholder="Search seeds, fertilizers, tools..."
                autocomplete="off"
            >

            <button
                type="button"
                onclick="searchProducts()"
            >
                🔍
            </button>

        </div>


        <!-- NAV -->

        <nav class="nav">

            <a href="index.html">
                Home
            </a>

            <a
                href="products.html"
                class="active"
            >
                Products
            </a>

            <a href="index.html#categories">
                Categories
            </a>

            <a href="index.html#about">
                About
            </a>

        </nav>


        <!-- ACCOUNT + CART -->

        <div class="header-actions">


            <!-- ACCOUNT -->

            <a
                href="account.html"
                class="products-account-btn"
                title="My Account"
            >

                <span class="products-account-avatar">
                    👤
                </span>

                <span class="products-account-text">

                    <strong>
                        My Account
                    </strong>

                    <small>
                        Login / Profile
                    </small>

                </span>

            </a>


            <!-- CART -->

            <button
                type="button"
                class="products-cart-btn"
                id="cartBtn"
                title="Shopping Cart"
            >

                <span class="products-cart-icon">
                    🛒
                </span>

                <span class="products-cart-text">

                    <strong>
                        Cart
                    </strong>

                    <small>
                        View items
                    </small>

                </span>

                <span
                    class="products-cart-count"
                    id="cartCount"
                >
                    0
                </span>

            </button>

        </div>

    </div>

</header>



<!-- =========================================
     PRODUCTS
========================================= -->

<main class="products-page">


    <div class="products-header">

        <span class="small-title">
            🌾 Agriculture Store
        </span>

        <h1>
            Our Products
        </h1>

        <p>
            Quality seeds, fertilizers, crop protection products
            and farming tools for better crops and better farming.
        </p>

    </div>



    <!-- PRODUCT TOOLBAR -->

    <div class="product-toolbar">


        <!-- SEARCH -->

        <div class="product-search-row">

            <div class="product-search">

                <input
                    type="search"
                    id="productSearch"
                    placeholder="Search products, categories..."
                    autocomplete="off"
                >

                <button
                    type="button"
                    onclick="searchProducts()"
                    aria-label="Search"
                >
                    🔍
                </button>

            </div>

        </div>



        <!-- FILTER + SORT -->

        <div class="product-controls">


            <div class="category-filter">

                <button
                    class="active"
                    type="button"
                    onclick="filterProducts('all', this)"
                >
                    All Products
                </button>

                <button
                    type="button"
                    onclick="filterProducts('Seeds', this)"
                >
                    🌱 Seeds
                </button>

                <button
                    type="button"
                    onclick="filterProducts('Fertilizers', this)"
                >
                    🌿 Fertilizers
                </button>

                <button
                    type="button"
                    onclick="filterProducts('Crop Protection', this)"
                >
                    🛡️ Crop Protection
                </button>

                <button
                    type="button"
                    onclick="filterProducts('Farm Tools', this)"
                >
                    🛠️ Farm Tools
                </button>

            </div>


            <select
                class="sort-select"
                id="sortProducts"
                onchange="sortProducts()"
            >

                <option value="default">
                    Sort By
                </option>

                <option value="low">
                    Price: Low to High
                </option>

                <option value="high">
                    Price: High to Low
                </option>

                <option value="name">
                    Name: A-Z
                </option>

            </select>

        </div>

    </div>



    <!-- PRODUCTS -->

    <div
        class="products-grid"
        id="productsGrid"
    ></div>

</main>



<!-- =========================================
     CART OVERLAY
========================================= -->

<div
    id="cartOverlay"
    class="cart-overlay"
></div>



<!-- =========================================
     CART SIDEBAR
========================================= -->

<aside
    id="cartSidebar"
    class="cart-sidebar"
>

    <div class="cart-header">

        <h2>
            Your Cart
        </h2>

        <button
            type="button"
            onclick="closeCart()"
        >
            ✕
        </button>

    </div>


    <div
        id="cartItems"
        class="cart-items"
    ></div>


    <div class="cart-footer">

        <div class="cart-total">

            <strong>
                Total:
            </strong>

            <strong id="cartTotal">
                ₹0
            </strong>

        </div>


        <button
            type="button"
            onclick="checkout()"
            class="btn btn-primary"
        >
            Checkout
        </button>

    </div>

</aside>



<!-- =========================================
     LOGIN MODAL
========================================= -->

<div
    id="loginModal"
    class="modal"
>

    <div class="modal-content">

        <button
            type="button"
            class="modal-close"
            onclick="closeLoginModal()"
        >
            ✕
        </button>


        <h2>
            Welcome Back 👋
        </h2>

        <p>
            Login to continue shopping.
        </p>


        <form id="loginForm">

            <input
                type="email"
                id="loginEmail"
                placeholder="Email address"
                autocomplete="email"
                required
            >


            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                autocomplete="current-password"
                required
            >


            <button
                type="submit"
                class="btn btn-primary"
            >
                Login
            </button>

        </form>

    </div>

</div>



<!-- =========================================
     TOAST
========================================= -->

<div
    id="toast"
    class="toast"
></div>



<!-- =========================================
     JAVASCRIPT
========================================= -->

<script src="js/script.js"></script>

<script src="js/products.js"></script>


</body>

</html>
